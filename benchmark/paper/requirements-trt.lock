# Torch-TensorRT venv. Pinned at 2.14.0+cu130, the same torch the main venv
# measures everything else with, so the TensorRT column is not the only one
# produced by a different torch. Separate venv because torch-tensorrt drags in
# its own tensorrt-cu13 stack; transformers/timm are here because the model
# scripts import them in whichever venv runs them.
# The 2.9.0+cu130 wheels this file used to name were withdrawn from the index,
# which is what made the venv stop installing; the --extra-index-url below was
# missing too, so nothing here resolved at all.
# Regenerate with:
#     uv pip compile --python-version 3.13 --emit-index-url \
#         --extra-index-url https://download.pytorch.org/whl/cu130 \
#         --index-strategy unsafe-best-match \
#         benchmark/paper/requirements-trt.in -o benchmark/paper/requirements-trt.lock
--index-url https://pypi.org/simple
--extra-index-url https://download.pytorch.org/whl/cu130

